<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>법인 ERP 스토리 광고</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1080px;height:1920px;font-family:Pretendard,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic","WenQuanYi Zen Hei",sans-serif;color:#fff;
 background:radial-gradient(900px 700px at 100% 0,#2a2e3b 0,transparent 60%),linear-gradient(180deg,#14161d 0%,#10141f 45%,#142048 100%);position:relative;overflow:hidden}
.circle{position:absolute;right:-260px;top:-300px;width:900px;height:900px;border-radius:50%;background:rgba(255,255,255,.04)}
.wrap{position:absolute;left:70px;right:70px;top:220px}
.badge{display:inline-block;background:#0c0d12;color:#f4c542;font-weight:800;font-size:30px;padding:20px 44px;border-radius:22px;border:1px solid #23252d}
h1{margin-top:44px;font-size:78px;line-height:1.3;font-weight:400;letter-spacing:-2px}
h1 b{font-weight:900}
.sub{margin-top:36px;font-size:38px;line-height:1.5;font-weight:700;color:#e9ebf2}
.card{margin-top:44px;background:linear-gradient(135deg,#f1f2f5,#c9cbd1);border-radius:44px;padding:44px 50px 36px;color:#16181f;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card .t{font-size:30px;font-weight:700;color:#4a4d57;margin-bottom:26px}
.row{display:flex;align-items:center;height:104px}
.ico{width:76px;height:76px;margin-right:40px;display:flex;align-items:center;justify-content:center;font-size:56px}
.tx{flex:1}.tx b{display:block;font-size:42px;font-weight:900;letter-spacing:-1px}
.tx span{font-size:27px;color:#555963;font-weight:500}
.ok{background:#e1f3e6;color:#1d6b3b;font-weight:800;font-size:28px;padding:20px 28px;border-radius:22px;box-shadow:0 4px 10px rgba(0,0,0,.08)}
.cta{position:absolute;left:50%;bottom:110px;transform:translateX(-50%);background:#fff;color:#111;border-radius:40px;padding:34px 70px;font-size:56px;font-weight:600;white-space:nowrap}
.cta i{font-style:normal;color:#3b82f6;margin-right:22px}
</style></head><body>
<div class="circle"></div>
<div class="wrap">
 <div class="badge">법인 ERP 평생 0원</div>
 <h1>은행 따로, 홈택스 따로.<br><b>매번 로그인하세요?</b></h1>
 <p class="sub">한 번만 인동하면<br>통장, 카드, 세금계산서가 알아서 모입니다.</p>
 <div class="card"><div class="t">연동 완료</div>
  <div class="row"><div class="ico">🏛️</div><div class="tx"><b>은행</b><span>입출금 내역 수집</span></div><div class="ok">✔ 연동 완료</div></div>
  <div class="row"><div class="ico">🧾</div><div class="tx"><b>홈택스</b><span>세금계산서·영수증 수집</span></div><div class="ok">✔ 연동 완료</div></div>
  <div class="row"><div class="ico">💳</div><div class="tx"><b>카드 내역</b><span>법인카드 사용 내역 수집</span></div><div class="ok">✔ 연동 완료</div></div>
  <div class="row"><div class="ico">🗂️</div><div class="tx"><b>카드 매출(여신금융협회)</b><span>전체 카드사 매출 일괄 집계</span></div><div class="ok">✔ 연동 완료</div></div>
  <div class="row"><div class="ico">🛒</div><div class="tx"><b>PG · 마켓플레이스</b><span>KG이니시스, 스마트스토어, 쿠팡 등 매출</span></div><div class="ok">✔ 연동 완료</div></div>
  <div class="row"><div class="ico">📈</div><div class="tx"><b>증권</b><span>미래에셋·삼성·KB 등 증권 거래내역</span></div><div class="ok">✔ 연동 완료</div></div>
 </div>
</div>
<div class="cta"><i>🔗</i>자세히 보기</div>
</body></html>
